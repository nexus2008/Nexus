<html lang="en">

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="css/style.css">

   <!-- SweetAlert2 CDN -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

   <style>
      /* Profile Page Input & Container Custom Styles to match UI */
      .user-profile .profile-form {
         background-color: var(--white, #fff);
         border-radius: .5rem;
         padding: 2rem;
         margin-top: 2rem;
         box-shadow: 0 .5rem 1rem rgba(0,0,0,.1);
      }
      .user-profile .profile-form .form-title {
         font-size: 2rem;
         color: var(--black, #333);
         margin-bottom: 1.5rem;
      }
      .user-profile .profile-form .input-group {
         margin-bottom: 1.5rem;
      }
      .user-profile .profile-form .input-group label {
         font-size: 1.5rem;
         color: var(--light-color, #666);
         display: block;
         margin-bottom: .5rem;
      }
      .user-profile .profile-form .input-field {
         width: 100%;
         border-radius: .5rem;
         padding: 1.2rem 1.4rem;
         font-size: 1.6rem;
         color: var(--black, #333);
         background-color: var(--light-bg, #eee);
         border: 1px solid rgba(0,0,0,.1);
         outline: none;
      }
      .user-profile .profile-form .input-field:disabled {
         opacity: 0.7;
         cursor: not-allowed;
      }
      .user-profile .profile-form .flex-inputs {
         display: flex;
         gap: 1.5rem;
         flex-wrap: wrap;
      }
      .user-profile .profile-form .flex-inputs .input-group {
         flex: 1 1 20rem;
      }
      .avatar-wrapper {
         position: relative;
         display: inline-block;
      }
      .avatar-upload-btn {
         position: absolute;
         bottom: 5px;
         right: 5px;
         background: var(--main-color, #8e44ad);
         color: #fff;
         width: 35px;
         height: 35px;
         border-radius: 50%;
         display: flex;
         align-items: center;
         justify-content: center;
         cursor: pointer;
         font-size: 1.4rem;
         box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
   </style>

</head>
<body>

<header class="header">
   <section class="flex">
      <a href="home.html" class="logo">NEXUS Platform</a>

      <form action="search.html" method="post" class="search-form">
         <input type="text" name="search_box" required placeholder="search courses..." maxlength="100">
         <button type="submit" class="fas fa-search"></button>
      </form>

      <div class="icons">

         <div id="search-btn" class="fas fa-search"></div>

      </div>

      <div class="profile">
         <img src="images/pic-1.jpg" id="header_avatar" class="image" alt="">
         <h3 class="name" id="header_name">You..</h3>
         <p class="role">student</p>
         <a href="profile.html" class="btn">view profile</a>
         <div class="flex-btn">
            <a href="login.html" class="option-btn">login</a>
            <a href="register.html" class="option-btn">register</a>
         </div>
      </div>
   </section>
</header>   

<div class="side-bar">
   <div id="close-btn">
      <i class="fas fa-times"></i>
   </div>

   <div class="profile">
      <img src="images/pic-1.jpg" id="sidebar_avatar" class="image" alt="">
      <h3 class="name" id="sidebar_name">You..</h3>
      <p class="role">student</p>
      <a href="profile.html" class="btn">view profile</a>
   </div>

   <nav class="navbar">
      <a href="home.html"><i class="fas fa-home"></i><span>home</span></a>
      <a href="about.html"><i class="fas fa-question"></i><span>about</span></a>
      <a href="courses.html"><i class="fas fa-graduation-cap"></i><span>courses</span></a>
      <a href="contact.html"><i class="fas fa-headset"></i><span>contact us</span></a>
   </nav>
</div>

<section class="user-profile">

   <h1 class="heading" id="page_title">your profile</h1>

   <div class="info">

      <div class="user">
         <div class="avatar-wrapper">
            <img src="images/pic-1.jpg" id="avatar_img" alt="" style="object-fit: cover;">
            <label id="avatar_upload_label" for="avatar_input" class="avatar-upload-btn">
               <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="avatar_input" accept="image/*" style="display: none;" onchange="previewAndSaveAvatar(event)" />
         </div>
         <h3 id="display_full_name">Loading...</h3>
         <p id="display_role">student</p>
         <p style="font-size: 1.4rem; color: var(--light-color); margin-top: .5rem;" id="display_uid">
            <i class="fas fa-id-card"></i> UID: --------
         </p>
         <a href="#" id="logout_btn" class="inline-btn" style="background-color: #e74c3c; margin-top: 1rem;"><i class="fas fa-power-off"></i> Quit / Logout</a>
      </div>

      <!-- Student Info Form -->
      <form class="profile-form" id="studentInfoForm" onsubmit="saveStudentInfo(event)">
         <h3 class="form-title"><i class="fas fa-user-shield"></i> Student Info</h3>

         <div class="input-group">
            <label for="name"><i class="fas fa-signature"></i> Full Name</label>
            <input type="text" id="name" name="name" class="input-field" placeholder="Full Name" required />
         </div>

         <div class="flex-inputs">
            <div class="input-group">
               <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
               <input type="tel" id="phone" name="phone" class="input-field" placeholder="0771234567" required />
            </div>
            <div class="input-group">
               <label for="email"><i class="fas fa-envelope"></i> Gmail Address</label>
               <input type="email" id="email" name="email" class="input-field" placeholder="user@gmail.com" />
            </div>
         </div>

         <div class="flex-inputs">
            <div class="input-group">
               <label for="first_name"><i class="fas fa-user"></i> First Name</label>
               <input type="text" id="first_name" name="first_name" class="input-field" placeholder="First Name" />
            </div>
            <div class="input-group">
               <label for="last_name"><i class="fas fa-user"></i> Last Name</label>
               <input type="text" id="last_name" name="last_name" class="input-field" placeholder="Last Name" />
            </div>
         </div>

         <div class="flex-inputs">
            <div class="input-group">
               <label for="telegram_username_id"><i class="fab fa-telegram"></i> Telegram Username</label>
               <input type="text" id="telegram_username_id" name="telegram_username" class="input-field" placeholder="@Username" />
            </div>
            <div class="input-group">
               <label for="id_exam_year"><i class="fas fa-graduation-cap"></i> Exam Year</label>
               <select id="id_exam_year" name="exam_year" class="input-field">
                  <option value="2026">2026 A/L</option>
                  <option value="2027">2027 A/L</option>
                  <option value="2024">2024 A/L</option>
                  <option value="2025">2025 A/L</option>
                  <option value="2028">2028 A/L</option>
               </select>
            </div>
         </div>

         <div id="save_btn_container" style="margin-top: 1rem;">
            <button type="submit" id="save_btn" class="inline-btn" style="cursor: pointer;">
               <i class="fas fa-floppy-disk"></i> Save Info
            </button>
         </div>
      </form>
   
   </div>

</section>

<footer class="footer">

<!-- custom js file link  -->
<script src="js/script.js"></script>

<script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
   import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
   import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

   // 🔐 Firebase Configuration
   const firebaseConfig = {
       apiKey: "AIzaSyCmciwmEbSDgA5PhCY12a_vKqXl4GDBeZ8",
       authDomain: "school-project-5fe93.firebaseapp.com",
       projectId: "school-project-5fe93",
       storageBucket: "school-project-5fe93.firebasestorage.app",
       messagingSenderId: "548925209782",
       appId: "1:548925209782:web:cea0aac7d41a510b2fba17",
       measurementId: "G-5MG8T54708"
   };

   const app = initializeApp(firebaseConfig);
   const auth = getAuth(app);
   const db = getFirestore(app);

   let currentUser = null;
   let targetUid = null;

   // ⚡ FAST CACHE LOAD: Page එක open වූ සැනින් Local Avatar එක පෙන්වීම (0.0s delay)
   const cachedAvatar = localStorage.getItem('student_avatar');
   if (cachedAvatar) {
       document.getElementById('avatar_img').src = cachedAvatar;
       document.getElementById('header_avatar').src = cachedAvatar;
       document.getElementById('sidebar_avatar').src = cachedAvatar;
   }

   const urlParams = new URLSearchParams(window.location.search);
   targetUid = urlParams.get('uid');

   // 🔄 Real-time Auth State Change Listener
   onAuthStateChanged(auth, async (user) => {
       if (user) {
           currentUser = user;
           
           if (!targetUid) {
               targetUid = user.uid;
           }

           if (targetUid !== user.uid) {
               document.getElementById('page_title').innerText = "Student Profile";
               document.getElementById('avatar_upload_label').style.display = 'none';
               document.getElementById('save_btn_container').style.display = 'none';
               
               document.getElementById('name').disabled = true;
               document.getElementById('phone').disabled = true;
               document.getElementById('email').disabled = true;
               document.getElementById('first_name').disabled = true;
               document.getElementById('last_name').disabled = true;
               document.getElementById('telegram_username_id').disabled = true;
               document.getElementById('id_exam_year').disabled = true;
           }

           document.getElementById('display_uid').innerHTML = `<i class="fas fa-id-card"></i> UID: ${targetUid}`;

           // Firestore Fetching
           let userDocRef = doc(db, "students", targetUid);
           let userDocSnap = await getDoc(userDocRef);

           if (!userDocSnap.exists()) {
               userDocRef = doc(db, "users", targetUid);
               userDocSnap = await getDoc(userDocRef);
           }

           if (userDocSnap.exists()) {
               const data = userDocSnap.data();
               
               document.getElementById('name').value = data.name || data.fullName || "";
               document.getElementById('display_full_name').innerText = data.name || data.fullName || "Student";
               document.getElementById('header_name').innerText = data.name || data.fullName || "You..";
               document.getElementById('sidebar_name').innerText = data.name || data.fullName || "You..";
               
               document.getElementById('phone').value = data.phone || "";
               document.getElementById('email').value = data.gmail || data.email || user.email || "";
               document.getElementById('first_name').value = data.firstName || "";
               document.getElementById('last_name').value = data.lastName || "";
               document.getElementById('telegram_username_id').value = data.telegram || "";
               document.getElementById('id_exam_year').value = data.examYear || "2026";
               
               if(data.avatar) {
                   document.getElementById('avatar_img').src = data.avatar;
                   document.getElementById('header_avatar').src = data.avatar;
                   document.getElementById('sidebar_avatar').src = data.avatar;
                   localStorage.setItem('student_avatar', data.avatar); // Cache refresh
               }
           }
       }
   });

   // 🗜️ Image Compression Function (Resizes photo to 250x250 max and ~25KB size)
   function compressImage(file, maxWidth = 250, maxHeight = 250, quality = 0.7) {
       return new Promise((resolve) => {
           const reader = new FileReader();
           reader.readAsDataURL(file);
           reader.onload = (event) => {
               const img = new Image();
               img.src = event.target.result;
               img.onload = () => {
                   const canvas = document.createElement('canvas');
                   let width = img.width;
                   let height = img.height;

                   if (width > height) {
                       if (width > maxWidth) {
                           height *= maxWidth / width;
                           width = maxWidth;
                       }
                   } else {
                       if (height > maxHeight) {
                           width *= maxHeight / height;
                           height = maxHeight;
                       }
                   }

                   canvas.width = width;
                   canvas.height = height;
                   const ctx = canvas.getContext('2d');
                   ctx.drawImage(img, 0, 0, width, height);
                   
                   // Returns compressed Base64 JPEG
                   resolve(canvas.toDataURL('image/jpeg', quality));
               };
           };
       });
   }

   // 📷 Optimized Avatar Preview & Save
   window.previewAndSaveAvatar = async function(event) {
       const file = event.target.files[0];
       if (file) {
           Swal.fire({
               title: 'Optimizing Photo...',
               text: 'කරුණාකර මොහොතක් රැඳී සිටින්න',
               allowOutsideClick: false,
               didOpen: () => Swal.showLoading()
           });

           // ⚡ Fast Image Compress
           const compressedAvatar = await compressImage(file, 250, 250, 0.7);
           
           document.getElementById('avatar_img').src = compressedAvatar;
           document.getElementById('header_avatar').src = compressedAvatar;
           document.getElementById('sidebar_avatar').src = compressedAvatar;

           localStorage.setItem('student_avatar', compressedAvatar);

           Swal.close();
       }
   };

   // 💾 Save Info
   window.saveStudentInfo = async function(event) {
       event.preventDefault();

       const saveBtn = document.getElementById('save_btn');
       saveBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;
       saveBtn.disabled = true;

       const fullName = document.getElementById('name').value;
       const phone = document.getElementById('phone').value;
       const gmail = document.getElementById('email').value;
       const firstName = document.getElementById('first_name').value;
       const lastName = document.getElementById('last_name').value;
       const telegram = document.getElementById('telegram_username_id').value;
       const examYear = document.getElementById('id_exam_year').value;
       const avatarSrc = document.getElementById('avatar_img').src;

       try {
           if (currentUser && targetUid === currentUser.uid) {
               await updateProfile(currentUser, { displayName: fullName });

               await setDoc(doc(db, "students", currentUser.uid), {
                   uid: currentUser.uid,
                   name: fullName,
                   fullName: fullName,
                   phone: phone,
                   gmail: gmail,
                   email: gmail,
                   firstName: firstName,
                   lastName: lastName,
                   telegram: telegram,
                   examYear: examYear,
                   avatar: avatarSrc,
                   updatedAt: new Date().toISOString()
               }, { merge: true });
           }

           localStorage.setItem('student_name', fullName);
           localStorage.setItem('student_phone', phone);
           localStorage.setItem('student_email', gmail);
           localStorage.setItem('student_first_name', firstName);
           localStorage.setItem('student_last_name', lastName);
           localStorage.setItem('student_telegram', telegram);
           localStorage.setItem('student_exam_year', examYear);
           localStorage.setItem('student_avatar', avatarSrc);

           document.getElementById('display_full_name').innerText = fullName;
           document.getElementById('header_name').innerText = fullName;
           document.getElementById('sidebar_name').innerText = fullName;

           Swal.fire({
               icon: 'success',
               title: 'Profile Updated!',
               text: 'ඔබගේ Profile තොරතුරු සාර්ථකව සුරැකිනු ලැබුවා!',
               confirmButtonColor: '#8e44ad'
           });

       } catch (error) {
           console.error(error);
           Swal.fire({
               icon: 'error',
               title: 'Error!',
               text: 'දත්ත සුරැකීමේදී ගැටලුවක් ඇතිවිය: ' + error.message
           });
       } finally {
           saveBtn.innerHTML = `<i class="fas fa-floppy-disk"></i> Save Info`;
           saveBtn.disabled = false;
       }
   };

   // Logout
   document.getElementById('logout_btn').addEventListener('click', (e) => {
       e.preventDefault();
       Swal.fire({
           title: 'Quit / Logout?',
           text: "ඔබට පද්ධතියෙන් ඉවත් වීමට අවශ්‍යද?",
           icon: 'warning',
           showCancelButton: true,
           confirmButtonColor: '#e74c3c',
           cancelButtonColor: '#aaa',
           confirmButtonText: 'Yes, Logout!'
       }).then((result) => {
           if (result.isConfirmed) {
               localStorage.clear();
               signOut(auth).then(() => {
                   window.location.href = 'login.html';
               });
           }
       });
   });
</script>

</body>
